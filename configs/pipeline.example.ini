[paths]
project_root = ../workspace
sra_root = ../workspace/sra
metadata_root = ../workspace/metadata
results_root = ../workspace/results
evidence_root = ../workspace/evidence
logs_root = ../workspace/logs
work_root = ../workspace/work
assembly_root = ../workspace/assemblies
state_db = ../workspace/state/jobs.sqlite
master_summary = ../workspace/results/batch.tsv

[references]
human_index = ../references/chm13v2.0_maskedY_rCRS.sr.mmi
kraken_db = ../references/kraken2
curated_run_assembly = ../workspace/metadata/optional_exact_assemblies.tsv
curated_assembly_paths = ../workspace/metadata/optional_assembly_paths.tsv

[acquisition]
source_mode = both
retries = 4
ena_api = https://www.ebi.ac.uk/ena/portal/api/filereport
ena_verify_md5 = yes

aws_cli = aws
aws_bucket = s3://sra-pub-run-odp/sra

ena_transport = https
ena_ascp = ../optional/ascp
ena_ascp_key = ../optional/aspera_bypass_rsa.pem
ena_ascp_port = 33001
ena_ascp_rate = 300m

ena_https_fallback = yes

[workers]
ncbi_workers = 1
ena_workers = 1
aws_download_workers = 4
aws_analysis_workers = 2
aws_prefetch_depth = 8
assembly_prefetch_workers = 4
threads_per_worker = 5
sort_threads = 2
kraken_threads = 5

global_analysis_slots = 1
[assembly]
query_retries = 4
ena_search_api = https://www.ebi.ac.uk/ena/portal/api/search

[cleanup]
delete_new_sra_after_success = no

[cache]
extra_sra_roots =

[reference_identity]
human_index_sha256 = SET_VERIFIED_64_CHARACTER_SHA256
human_fasta = ../references/chm13v2.0_maskedY_rCRS.fa
kraken_identity_file = ../references/kraken2_identity.json
